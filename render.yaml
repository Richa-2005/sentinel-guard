services:
  - type: web
    name: sentinel-guard-backend
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: JWT_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
